# Neo4j Enterprise + GDS + APOC + the custom Pregel procedure (netdt.bgp.pregel).
#   cp .env.example .env   # then set NEO4J_PASSWORD
#   docker compose up -d --build
#   docker compose --profile batfish up -d   # optional, scenario 7
services:
  pregel-build:                       # builds the jar (multi-stage) and drops it in ./plugins, then exits
    build:
      context: .
      dockerfile: docker/Dockerfile.pregel
      target: export
      args:
        NEO4J_VERSION: ${NEO4J_VERSION:-2026.10.2}
    volumes:
      - ./plugins:/plugins

  neo4j:
    image: neo4j:${NEO4J_VERSION:-2026.10.2}-enterprise
    depends_on:
      pregel-build:
        condition: service_completed_successfully
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      # The custom namespace must be both unrestricted and allow-listed, otherwise the procedure is invisible.
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*,netdt.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*,netdt.*"
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      # Optional GDS licence (lifts the concurrency cap of 4). Mount your key file and uncomment both lines:
      # NEO4J_gds_enterprise_license__file: /licenses/gds.license
    volumes:
      - ./plugins:/plugins
      # - ./gds.license:/licenses/gds.license:ro
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  batfish:                            # optional: docker compose --profile batfish up -d
    profiles: ["batfish"]
    build: ./batfish-sidecar
    ports:
      - "${BATFISH_SIDECAR_PORT:-5005}:5005"

volumes:
  neo4j-data:
